name: Build ExynosBess APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

        with:
          submodules: recursive
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Install dtc build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flex \
            bison \
            make \
            git \
            file

      - name: Install Android NDK

        run: |

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"


      - name: Build Android ARM64 dtc
        run: |
          git clone \
            --depth=1 \
            --branch standalone \
            https://github.com/libxzr/dtc-aosp.git \
            /tmp/dtc-aosp

          export NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          cd /tmp/dtc-aosp

          make clean || true

          make \
            NO_PYTHON=1 \
            CC="$TOOLCHAIN/bin/aarch64-linux-android26-clang" \
            AR="$TOOLCHAIN/bin/llvm-ar" \
            STRIP="$TOOLCHAIN/bin/llvm-strip" \
            dtc

          file dtc

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/tools"

          cp dtc \
            "$GITHUB_WORKSPACE/app/src/main/assets/tools/dtc"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExynosBess-debug
          path: app/build/outputs/apk/debug/app-debug.apk
